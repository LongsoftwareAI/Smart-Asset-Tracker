<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Asset Tracker</title>
    <meta name="description" content="Asset tracking and management system with QR identification, check-in/out workflows, location hierarchy, and movement audit history." />
    <meta property="og:title" content="Smart Asset Tracker" />
    <meta property="og:description" content="Asset tracking and management system with QR identification, check-in/out workflows, location hierarchy, and movement audit history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        const origError = console.error;
        console.error = function (...args) {
          if (
            typeof args[0] === 'string' &&
            args[0].includes('[vite] failed to connect to websocket')
          ) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function (event) {
          if (
            event.reason &&
            (event.reason.message?.includes('WebSocket') ||
              String(event.reason).includes('WebSocket'))
          ) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
